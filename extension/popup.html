<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoReels</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #e53e3e;
      --red-light: #fc8181;
      --bg: #0f0a0a;
      --card: #1a1010;
      --border: rgba(229,62,62,0.18);
      --text: #f5f0f0;
      --text-dim: #9e8f8f;
      --text-muted: #5e4f4f;
      --green: #4ade80;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 0;
      user-select: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 1.1rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .logo-icon {
      width: 30px; height: 30px;
      background: var(--red);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo-text span { color: var(--red-light); }
    .header-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s infinite;
    }
    .status-dot.off { background: var(--text-muted); box-shadow: none; animation: none; }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Toggles */
    .section {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 0.85rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .toggle-row:last-child { margin-bottom: 0; }
    .toggle-row:hover { border-color: rgba(229,62,62,0.35); }

    .toggle-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .app-badge {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .app-badge-ig { background: linear-gradient(135deg, #f58529, #dd2a7b); }
    .app-badge-yt { background: #ff0000; }

    .toggle-name {
      font-size: 0.88rem;
      font-weight: 600;
    }
    .toggle-sub {
      font-size: 0.73rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* iOS-style toggle switch */
    .switch {
      position: relative;
      width: 40px; height: 22px;
      flex-shrink: 0;
    }
    .switch input { display: none; }
    .switch-track {
      position: absolute;
      inset: 0;
      background: #2a1818;
      border-radius: 11px;
      border: 1px solid rgba(229,62,62,0.15);
      transition: background 0.25s, border-color 0.25s;
    }
    .switch-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      background: #5e4f4f;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(.22,.68,0,1.2), background 0.25s;
    }
    .switch input:checked ~ .switch-track { background: var(--red); border-color: var(--red); }
    .switch input:checked ~ .switch-thumb { transform: translateX(18px); background: white; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.7rem 0.85rem;
    }
    .stat-num {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--red-light);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      line-height: 1.3;
    }

    /* Footer */
    .footer {
      padding: 0.7rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .footer-text { font-size: 0.7rem; color: var(--text-muted); }
    .reset-btn {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    .reset-btn:hover { color: var(--text-dim); background: rgba(255,255,255,0.04); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo-icon">🚫</div>
    <span class="logo-text">No<span>Reels</span></span>
    <div class="header-status">
      <div class="status-dot" id="globalDot"></div>
      <span id="globalStatus">Activo</span>
    </div>
  </div>

  <!-- Toggles -->
  <div class="section">
    <div class="section-label">Bloqueos activos</div>

    <label class="toggle-row" for="toggleIG">
      <div class="toggle-left">
        <div class="app-badge app-badge-ig">📸</div>
        <div>
          <div class="toggle-name">Instagram Reels</div>
          <div class="toggle-sub">Bloquea /reels/ y la pestaña Reels</div>
        </div>
      </div>
      <div class="switch">
        <input type="checkbox" id="toggleIG" checked>
        <div class="switch-track"></div>
        <div class="switch-thumb"></div>
      </div>
    </label>

    <label class="toggle-row" for="toggleYT">
      <div class="toggle-left">
        <div class="app-badge app-badge-yt">▶</div>
        <div>
          <div class="toggle-name">YouTube Shorts</div>
          <div class="toggle-sub">Redirige Shorts a video normal</div>
        </div>
      </div>
      <div class="switch">
        <input type="checkbox" id="toggleYT" checked>
        <div class="switch-track"></div>
        <div class="switch-thumb"></div>
      </div>
    </label>
  </div>

  <!-- Stats -->
  <div class="section">
    <div class="section-label">Esta semana</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="statBlocked">0</div>
        <div class="stat-label">intentos bloqueados</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statTime">0 min</div>
        <div class="stat-label">tiempo recuperado</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statIG">0</div>
        <div class="stat-label">Reels bloqueados</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statYT">0</div>
        <div class="stat-label">Shorts bloqueados</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">NoReels v1.0</span>
    <button class="reset-btn" id="resetBtn">Resetear estadísticas</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
